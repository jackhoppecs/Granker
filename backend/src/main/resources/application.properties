spring.application.name=granker-backend

# Local fallback values exist for convenience.
# Production overrides them with environment variables.
# Sensitive values are not hardcoded.
# host environment contains the secrets 
# This file is essentially a template
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/granker}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.seed.enabled=${SEED_ENABLED:false}

# SQL logging is off by default.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# Seed/admin creation are disabled by default.
app.admin.create-enabled=${ADMIN_CREATE_ENABLED:false}
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Production cross-site frontend/backend deployments may require:
# server.servlet.session.cookie.secure=true
# server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.http-only=true